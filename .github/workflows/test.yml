name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: uname -r
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=3 ./...
      - run: probes/run.sh
      # Router tests: ICMP from a real router in a network namespace (needs root).
      - run: sudo netns/setup.sh
      - run: go test -c -o errqueue.test .
      - run: sudo ERRQUEUE_NETNS=1 ./errqueue.test -test.run Router -test.v -test.count=1
